<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula OS - Elite Edition</title>
    <style>
        :root {
            --neon-purple: #bc13fe;
            --bg-dark: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .interface {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 15px;
            text-shadow: 0 0 30px var(--neon-purple);
            margin-bottom: 60px;
            text-transform: uppercase;
        }

        .app-container {
            display: flex;
            gap: 40px;
            pointer-events: auto;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(188, 19, 254, 0.3);
            padding: 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 120px;
            backdrop-filter: blur(10px);
        }

        .app-card:hover {
            transform: scale(1.1) translateY(-15px);
            background: rgba(188, 19, 254, 0.15);
            border-color: var(--neon-purple);
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.4);
        }

        .app-card:active {
            transform: scale(0.9);
        }

        .app-card img {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px var(--neon-purple));
        }

        .app-label {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .status-msg { color: #ff4444; margin-top: 20px; position: absolute; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <canvas id="nebulaCanvas"></canvas>

    <div class="interface">
        <h1>NEBULA OS</h1>
        <div class="app-container" id="app-grid"></div>
        <div id="error-log" class="status-msg"></div>
    </div>

    <script>
        const canvas = document.getElementById('nebulaCanvas');
        const ctx = canvas.getContext('2d');
        const clickSound = new Audio('https://www.soundjay.com/buttons/button-50.mp3');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const particleCount = 120;
        const connectionDist = 150;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            repel(mx, my) {
                const dx = this.x - mx;
                const dy = this.y - my;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 100) {
                    this.vx += dx / 100;
                    this.vy += dy / 100;
                }
            }
        }

        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(188, 19, 254, 0.15)';
            ctx.fillStyle = '#bc13fe';

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.update();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < connectionDist) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousedown', (e) => {
            particles.forEach(p => p.repel(e.clientX, e.clientY));
            clickSound.currentTime = 0;
            clickSound.play().catch(() => {});
        });

        animate();

        // JSON DATA FETCH (Fix für deine Struktur)
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('app-grid');
                data.apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML = `
                        <img src="${app.icon}">
                        <div class="app-label">${app.name}</div>
                    `;
                    card.onclick = () => {
                        clickSound.play();
                        console.log("Action: " + app.action);
                    };
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('error-log').innerText = "System-Error: " + err.message;
            });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula OS - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #bc13fe;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(188, 19, 254, 0.6);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: white;
            font-family: 'Roboto', sans-serif; overflow: hidden;
        }

        #nebulaCanvas { position: fixed; top: 0; left: 0; z-index: 1; }

        .os-wrapper {
            position: relative; z-index: 10;
            display: flex; width: 100vw; height: 100vh;
            pointer-events: none;
        }
        
        .sidebar, .main-content, .app-card, .download-btn, .details-panel { pointer-events: auto; }

        /* Sidebar */
        .sidebar {
            width: 95px; background: rgba(0, 0, 0, 0.85);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center;
            padding-top: 30px; gap: 20px; backdrop-filter: blur(20px);
        }

        .nav-item {
            width: 65px; height: 65px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            background: var(--glass); border: 1px solid transparent;
            font-family: 'Orbitron'; font-weight: bold; font-size: 1.4rem;
        }

        .nav-item img { width: 32px; height: 32px; filter: brightness(0) invert(1); opacity: 0.9; }
        .nav-item.active { background: var(--neon); box-shadow: 0 0 30px var(--neon); }

        .rgb-glow { animation: rgbShift 4s infinite linear; border: 1px solid currentColor; }
        @keyframes rgbShift {
            0% { color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            33% { color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            66% { color: #0000ff; box-shadow: 0 0 15px #0000ff; }
            100% { color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }

        /* Headers */
        .page-header {
            font-family: 'Orbitron'; font-size: 4rem; letter-spacing: 15px;
            margin-bottom: 50px; text-align: center; font-weight: 700;
        }

        .header-fade { animation: nebulaFade 3s infinite alternate ease-in-out; }
        @keyframes nebulaFade {
            0% { color: #ffffff; text-shadow: 0 0 15px #fff; }
            100% { color: #4b0082; text-shadow: 0 0 40px var(--neon); }
        }

        .header-rgb { animation: rgbText 3s infinite linear; text-shadow: 0 0 30px currentColor; }
        @keyframes rgbText { 0% { color: #ff0000; } 33% { color: #00ff00; } 66% { color: #0000ff; } 100% { color: #ff0000; } }

        /* App Card mit Version */
        .app-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 20px; text-align: center;
            cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
            display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        .app-card:hover { background: rgba(188, 19, 254, 0.15); transform: translateY(-5px); }

        .version-tag {
            position: absolute; top: 10px; left: 15px;
            font-family: 'Orbitron'; font-size: 0.6rem; color: #fff;
            animation: whitePulse 2s infinite alternate ease-in-out;
            opacity: 0.8;
        }

        @keyframes whitePulse {
            0% { opacity: 0.4; text-shadow: 0 0 2px #fff; }
            100% { opacity: 1; text-shadow: 0 0 8px #fff; }
        }

        /* Icon Styling */
        .icon-box { width: 64px; height: 64px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .letter-icon {
            width: 60px; height: 60px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron'; font-size: 1.8rem; border: 2px solid;
            animation: glowPulse 2s infinite alternate ease-in-out;
        }

        @keyframes glowPulse {
            0% { opacity: 0.8; box-shadow: 0 0 5px currentColor; }
            100% { opacity: 1; box-shadow: 0 0 20px currentColor; }
        }

        /* Details Panel Tags */
        .details-panel {
            width: 450px; background: rgba(0, 0, 0, 0.93); border: 1px solid var(--glass-border);
            border-radius: 40px; padding: 40px; display: flex; flex-direction: column; align-items: center;
            opacity: 0; transform: translateX(40px); transition: 0.5s; backdrop-filter: blur(30px);
            max-height: 85vh; overflow-y: auto;
        }
        .details-panel.visible { opacity: 1; transform: translateX(0); }

        .tag-display {
            font-family: 'Orbitron'; font-size: 0.9rem; font-weight: bold;
            margin-top: 20px; margin-bottom: 5px;
            animation: redWhiteFade 1.5s infinite alternate ease-in-out;
        }

        @keyframes redWhiteFade {
            0% { color: #fff; text-shadow: 0 0 5px #fff; }
            100% { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
        }

        .download-btn {
            width: 100%; padding: 20px; background: var(--neon); border-radius: 40px; 
            color: white; font-family: 'Orbitron'; text-decoration: none; 
            text-align: center; font-weight: bold; cursor: pointer;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 10px; }
    </style>
</head>
<body>

<canvas id="nebulaCanvas"></canvas>

<div class="os-wrapper">
    <nav class="sidebar">
        <div class="nav-item active" onclick="switchTab('home', this)"><img src="https://img.icons8.com/material-rounded/48/home.png"></div>
        <div class="nav-item" onclick="switchTab('acc', this)"><img src="https://img.icons8.com/material-rounded/48/user.png"></div>
        <div class="nav-item rgb-glow" onclick="switchTab('java', this)">J</div>
        <div class="nav-item rgb-glow" onclick="switchTab('bedrock', this)">B</div>
    </nav>

    <main class="main-content" style="flex: 1; display: flex; padding: 40px; gap: 40px;">
        <div class="content-area" style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <div id="main-header" class="page-header header-fade">NEBULA OS</div>
            <div id="app-grid" class="app-grid"></div>
        </div>

        <div id="details" class="details-panel">
            <div id="det-icon-container" style="width:150px; height:150px; display:flex; align-items:center; justify-content:center;"></div>
            <h2 id="det-title" style="font-family:Orbitron; text-align: center; margin-top: 20px;"></h2>
            <p id="det-desc" style="color:#ccc; font-size:1rem; line-height:1.6; text-align:center; flex-grow: 1;"></p>
            <div id="det-tags" class="tag-display"></div>
            <a id="det-link" href="#" class="download-btn" target="_blank">GET CLIENT</a>
        </div>
    </main>
</div>

<script>
    const thock = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
    thock.volume = 0.5;

    const canvas = document.getElementById('nebulaCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    let particles = [];
    const neonColors = ['#ff0000', '#00ff00', '#00ccff', '#ffcc00', '#bc13fe'];

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.28;
            this.vy = (Math.random() - 0.5) * 0.28;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if(this.x < 0) { this.x = 0; this.vx *= -0.8; }
            if(this.x > canvas.width) { this.x = canvas.width; this.vx *= -0.8; }
            if(this.y < 0) { this.y = 0; this.vy *= -0.8; }
            if(this.y > canvas.height) { this.y = canvas.height; this.vy *= -0.8; }
        }
    }

    for(let i=0; i<85; i++) particles.push(new Particle());

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach((p, i) => {
            p.update();
            ctx.fillStyle = "rgba(188, 19, 254, 0.9)";
            ctx.beginPath(); ctx.arc(p.x, p.y, 2.8, 0, Math.PI*2); ctx.fill();
            for(let j=i+1; j<particles.length; j++) {
                let p2 = particles[j];
                let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                if(d < 180) {
                    ctx.strokeStyle = `rgba(188, 19, 254, ${0.5 * (1 - d/180)})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
            }
        });
        requestAnimationFrame(draw);
    }
    draw();

    window.addEventListener('mousedown', (e) => {
        thock.currentTime = 0; thock.play().catch(()=>{});
        particles.forEach(p => {
            let d = Math.hypot(p.x-e.clientX, p.y-e.clientY);
            if(d < 300) {
                let force = (300 - d) * 0.00008; 
                p.vx += (p.x - e.clientX) * force;
                p.vy += (p.y - e.clientY) * force;
            }
        });
    });

    fetch('data.json').then(res => res.json()).then(data => {
        window.allApps = data.apps;
        renderApps('home');
    });

    function createIconElement(app, isBig = false) {
        const box = document.createElement('div');
        box.className = isBig ? '' : 'icon-box';
        const color = neonColors[app.name.length % neonColors.length];

        if (app.img && app.img.trim() !== "") {
            const img = document.createElement('img');
            img.src = app.img;
            img.style.width = isBig ? '150px' : '64px';
            img.style.height = isBig ? '150px' : '64px';
            img.style.objectFit = 'contain';
            img.style.borderRadius = isBig ? '25px' : '10px';
            if(isBig) img.style.border = '2px solid var(--neon)';
            img.onerror = () => { box.innerHTML = ''; box.appendChild(createLetterElement(app.name, color, isBig)); };
            box.appendChild(img);
        } else {
            box.appendChild(createLetterElement(app.name, color, isBig));
        }
        return box;
    }

    function createLetterElement(name, color, isBig) {
        const div = document.createElement('div');
        div.className = 'letter-icon';
        div.innerText = name.charAt(0).toUpperCase();
        div.style.color = color; div.style.borderColor = color;
        if(isBig) { div.style.width = '150px'; div.style.height = '150px'; div.style.fontSize = '5rem'; }
        return div;
    }

    function renderApps(category) {
        const grid = document.getElementById('app-grid');
        grid.innerHTML = '';
        const filtered = window.allApps.filter(app => {
            if(category === 'home') return true;
            if(category === 'acc') return false;
            return app.tags.some(t => t.toLowerCase().includes(category));
        });

        filtered.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            
            // VERSION TAG LINKS OBEN
            if(app.version) {
                const vTag = document.createElement('div');
                vTag.className = 'version-tag';
                vTag.innerText = app.version;
                card.appendChild(vTag);
            }

            card.appendChild(createIconElement(app));
            const nameLabel = document.createElement('div');
            nameLabel.style.fontFamily = 'Orbitron';
            nameLabel.style.fontSize = '0.85rem';
            nameLabel.innerText = app.name;
            card.appendChild(nameLabel);

            card.onclick = (e) => {
                e.stopPropagation();
                thock.currentTime = 0; thock.play().catch(()=>{});
                showDetails(app);
            };
            grid.appendChild(card);
        });
    }

    function showDetails(app) {
        const panel = document.getElementById('details');
        panel.classList.remove('visible');
        setTimeout(() => {
            const container = document.getElementById('det-icon-container');
            container.innerHTML = '';
            container.appendChild(createIconElement(app, true));
            document.getElementById('det-title').innerText = app.name;
            document.getElementById('det-desc').innerText = app.desc;
            document.getElementById('det-link').href = app.url;

            // TAGS ANZEIGEN (FADE ROT/WEISS)
            const tagContainer = document.getElementById('det-tags');
            // Wir filtern Tags raus, die nur für die Kategorisierung da sind (java/bedrock)
            const displayTags = app.tags.filter(t => t !== "Java" && t !== "Bedrock");
            tagContainer.innerText = displayTags.map(t => "#" + t).join(" ");

            panel.classList.add('visible');
            panel.scrollTop = 0;
        }, 100);
    }

    function switchTab(cat, el) {
        thock.currentTime = 0; thock.play().catch(()=>{});
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const header = document.getElementById('main-header');
        if(cat === 'home') { header.innerText = "NEBULA OS"; header.className = "page-header header-fade"; }
        else if(cat === 'acc') { header.innerText = "ACCOUNT GEN"; header.className = "page-header header-fade"; }
        else { header.innerText = cat.toUpperCase() + " EDITION"; header.className = "page-header header-rgb"; }
        renderApps(cat);
    }
</script>
</body>
</html>

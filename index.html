<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula OS | Live Data</title>
    <style>
        :root {
            --bg-dark: #010101;
            --accent-purple: #2e004f;
            --neon-glow: #bc13fe;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* Hintergrund: Ultra-Deutlich & Dynamisch */
        #bg-canvas {
            position: fixed; top: 0; left: 0;
            z-index: 1;
            background: radial-gradient(circle at center, #130025 0%, #000 100%);
        }

        .main-wrapper {
            position: relative; z-index: 10;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 80px 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 60px;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, var(--neon-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(188, 19, 254, 0.6));
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px; width: 100%; max-width: 1100px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 35px;
            padding: 40px; text-align: center;
            transition: transform 0.4s ease, border-color 0.3s;
        }

        .app-card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-glow);
        }

        .btn-box { position: relative; display: inline-block; }

        .btn-launch {
            background: var(--accent-purple);
            color: white; border: none;
            padding: 16px 50px; border-radius: 50px;
            font-weight: 800; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(188, 19, 254, 0.3);
            outline: none;
            position: relative; z-index: 5;
        }

        .btn-launch:active {
            background: white !important;
            color: black;
            transform: scale(0.9);
        }

        .smoke-particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            box-shadow: 0 0 15px white;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(1.8); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-wrapper">
        <h1>NEBULA OS</h1>
        <div id="app-list" class="app-grid">
            </div>
    </div>

    <script>
        // --- DEZENTER CLICK SOUND ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSoftClick() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            if (navigator.vibrate) navigator.vibrate(5);
        }

        // --- BACKGROUND LOGIK ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: -2000, y: -2000, radius: 180 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    size: Math.random() * 3 + 0.5
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let dist = Math.hypot(dx, dy);
                if(dist < mouse.radius) {
                    let force = (mouse.radius - dist) / mouse.radius;
                    p.x -= (dx / dist) * force * 8;
                    p.y -= (dy / dist) * force * 8;
                }

                ctx.fillStyle = "rgba(188, 19, 254, 0.7)";
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();

                for(let j=i+1; j<particles.length; j++){
                    let p2 = particles[j];
                    let d = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if(d < 150) {
                        ctx.strokeStyle = `rgba(188, 19, 254, ${(1 - d/150) * 0.5})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(draw);
        }

        // --- FETCH & RENDER ---
        async function loadApps() {
            const grid = document.getElementById('app-list');
            try {
                // Versuche die data.json zu laden
                const response = await fetch('data.json');
                const apps = await response.json();

                grid.innerHTML = ''; // Leeren falls nötig
                apps.forEach(app => {
                    grid.innerHTML += `
                        <div class="app-card">
                            <h2>${app.name}</h2>
                            <p style="color:#aaa; margin-bottom: 25px;">${app.desc}</p>
                            <div class="btn-box">
                                <button class="btn-launch" onmousedown="triggerAction(this, '${app.url}')">LAUNCH</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                grid.innerHTML = `<p style="color:red">Fehler beim Laden der data.json: ${error.message}</p>`;
            }
        }

        function triggerAction(btn, url) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSoftClick();

            // Rauch-Effekt
            const parent = btn.parentElement;
            for(let i=0; i<35; i++) {
                const p = document.createElement('div');
                p.className = 'smoke-particle';
                const size = Math.random() * 12 + 5;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.left = "50%"; p.style.top = "50%";
                const tx = (Math.random() - 0.5) * 250 + 'px';
                const ty = -(Math.random() * 300 + 50) + 'px';
                p.style.setProperty('--x', tx); p.style.setProperty('--y', ty);
                p.style.animation = `explode ${Math.random() * 0.8 + 0.4}s forwards cubic-bezier(0.1, 1, 0.3, 1)`;
                parent.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }

            // Weiterleitung nach kurzem Delay für den Effekt
            setTimeout(() => {
                if(url && url !== "#") window.location.href = url;
            }, 400);
        }

        init(); draw(); loadApps();
        window.onresize = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula OS - Smooth Glide Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #bc13fe;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(188, 19, 254, 0.6);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: white;
            font-family: 'Roboto', sans-serif; overflow: hidden;
        }

        #nebulaCanvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        .os-wrapper {
            position: relative; z-index: 10;
            display: flex; width: 100vw; height: 100vh;
            pointer-events: none; 
        }
        
        .sidebar, .main-content, .app-card, .download-btn, .details-panel, .close-btn, .nav-item { 
            pointer-events: auto; 
        }

        /* Sidebar */
        .sidebar {
            width: 95px; background: rgba(0, 0, 0, 0.92);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center;
            padding-top: 30px; gap: 20px; backdrop-filter: blur(20px);
            z-index: 100;
        }

        .nav-item {
            width: 65px; height: 65px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            background: var(--glass); border: 1px solid transparent;
            font-family: 'Orbitron'; font-weight: bold; font-size: 1.4rem;
        }
        .nav-item img { width: 32px; height: 32px; filter: brightness(0) invert(1); opacity: 0.8; }
        .nav-item.active { background: var(--neon); box-shadow: 0 0 30px var(--neon); color: white !important; }

        /* ARGB SCHRIFT REITER */
        .argb-text {
            animation: argbLoop 5s infinite linear;
            border: 2px solid currentColor !important;
        }

        @keyframes argbLoop {
            0% { color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            33% { color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            66% { color: #0000ff; box-shadow: 0 0 15px #0000ff; }
            100% { color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }

        .main-content { flex: 1; display: flex; padding: 40px; gap: 30px; height: 100vh; box-sizing: border-box; }
        .content-area { flex: 1; display: flex; flex-direction: column; height: 100%; }

        .page-header {
            font-family: 'Orbitron'; font-size: 3.5rem; letter-spacing: 12px;
            margin-bottom: 30px; text-align: center; font-weight: 700;
            animation: nebulaFade 3s infinite alternate;
        }

        .app-grid {
            width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 25px; overflow-y: auto; padding: 10px; padding-bottom: 150px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 20px; text-align: center;
            cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
            position: relative;
        }
        .app-card:hover { background: rgba(188, 19, 254, 0.15); transform: translateY(-5px); }

        .version-tag {
            position: absolute; top: 8px; left: 12px;
            font-family: 'Orbitron'; font-size: 0.6rem; color: #fff;
            animation: whitePulse 2s infinite alternate;
        }

        /* Details Panel */
        .details-panel {
            width: 420px; background: rgba(0, 0, 0, 0.96); border: 1px solid var(--glass-border);
            border-radius: 30px; padding: 40px; display: none; flex-direction: column; 
            align-items: center; position: relative; backdrop-filter: blur(40px);
            box-shadow: -20px 0 50px rgba(0,0,0,0.5); z-index: 1000;
        }
        .details-panel.visible { display: flex; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .close-btn { position: absolute; top: 20px; right: 25px; font-family: 'Orbitron'; font-size: 1.5rem; color: var(--neon); cursor: pointer; }

        .tag-display {
            font-family: 'Orbitron'; font-size: 0.85rem; margin: 15px 0;
            animation: redWhiteFade 1.5s infinite alternate;
            font-weight: bold;
        }

        @keyframes redWhiteFade { 0% { color: #fff; text-shadow: 0 0 5px #fff; } 100% { color: #ff0000; text-shadow: 0 0 15px #ff0000; } }
        @keyframes nebulaFade { 0% { color: #fff; text-shadow: 0 0 10px #fff; } 100% { color: #bc13fe; text-shadow: 0 0 25px #bc13fe; } }
        @keyframes whitePulse { from { opacity: 0.4; } to { opacity: 1; } }

        .download-btn {
            width: 100%; padding: 18px; background: var(--neon); border-radius: 40px; 
            color: white; font-family: 'Orbitron'; text-decoration: none; 
            text-align: center; font-weight: bold; margin-top: 5px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 10px; }
    </style>
</head>
<body>

<canvas id="nebulaCanvas"></canvas>

<div class="os-wrapper" id="osWrapper">
    <nav class="sidebar">
        <div class="nav-item active" onclick="switchTab('home', this)"><img src="https://img.icons8.com/material-rounded/48/home.png"></div>
        <div class="nav-item" onclick="switchTab('acc', this)"><img src="https://img.icons8.com/material-rounded/48/user.png"></div>
        <div class="nav-item argb-text" onclick="switchTab('java', this)">J</div>
        <div class="nav-item argb-text" onclick="switchTab('bedrock', this)">B</div>
    </nav>

    <main class="main-content">
        <div class="content-area">
            <div id="main-header" class="page-header">NEBULA OS</div>
            <div id="app-grid" class="app-grid"></div>
        </div>

        <div id="details" class="details-panel">
            <div class="close-btn" onclick="closeDetails()">✕</div>
            <div id="det-icon-container" style="width:140px; height:140px; display:flex; align-items:center; justify-content:center;"></div>
            <h2 id="det-title" style="font-family:Orbitron; margin: 20px 0; text-align: center;"></h2>
            <div id="det-desc-scroll" style="overflow-y:auto; flex:1; width:100%; padding-right:10px;">
                <p id="det-desc" style="color:#ccc; font-size:0.95rem; line-height:1.6; text-align:center;"></p>
            </div>
            <div id="det-tags" class="tag-display"></div>
            <a id="det-link" href="#" class="download-btn" target="_blank">DOWNLOAD</a>
        </div>
    </main>
</div>

<script>
    const thock = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
    thock.volume = 0.4;

    const canvas = document.getElementById('nebulaCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    let mouse = { x: null, y: null };
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

    let particles = [];
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.5; 
            this.vy = (Math.random() - 0.5) * 0.5;
            this.radius = 2.5;
        }
        update() {
            // Sanfte Verdrängung durch die Maus (Gleiteffekt)
            if (mouse.x != null) {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.hypot(dx, dy);
                if (distance < 200) {
                    let force = (200 - distance) / 200;
                    let moveX = (dx / distance) * force * 1.5; // Wie stark sie gleiten
                    let moveY = (dy / distance) * force * 1.5;
                    this.x -= moveX;
                    this.y -= moveY;
                }
            }

            this.x += this.vx; this.y += this.vy;

            if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
    }

    for(let i=0; i<85; i++) particles.push(new Particle());

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach((p, i) => {
            p.update();
            ctx.fillStyle = "rgba(188, 19, 254, 0.9)";
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
            for(let j=i+1; j<particles.length; j++) {
                let p2 = particles[j];
                let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                if(d < 180) {
                    ctx.strokeStyle = `rgba(188, 19, 254, ${0.4 * (1 - d/180)})`;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
            }
        });
        requestAnimationFrame(draw);
    }
    draw();

    fetch('data.json').then(res => res.json()).then(data => {
        window.allApps = data.apps;
        renderApps('home');
    });

    function renderApps(category) {
        const grid = document.getElementById('app-grid');
        grid.innerHTML = '';
        const filtered = window.allApps.filter(app => {
            if(category === 'home') return true;
            if(category === 'acc') return false;
            let tagStr = app.tags.join(" ").toLowerCase();
            return tagStr.includes(category.toLowerCase());
        });

        filtered.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            if(app.version) {
                const v = document.createElement('div');
                v.className = 'version-tag'; v.innerText = app.version;
                card.appendChild(v);
            }
            const iconBox = document.createElement('div');
            iconBox.style.cssText = "width:64px; height:64px; margin: 15px auto; display:flex; align-items:center; justify-content:center;";
            if(app.img && app.img !== "") {
                const img = document.createElement('img');
                img.src = app.img; img.style.width="100%"; img.style.height="100%"; img.style.objectFit="contain";
                img.onerror = () => { iconBox.innerHTML = `<div style="color:var(--neon); border:2px solid var(--neon); width:100%; height:100%; display:flex; align-items:center; justify-content:center; border-radius:12px; font-family:Orbitron; font-size:1.5rem;">${app.name.charAt(0)}</div>`; };
                iconBox.appendChild(img);
            } else {
                iconBox.innerHTML = `<div style="color:var(--neon); border:2px solid var(--neon); width:100%; height:100%; display:flex; align-items:center; justify-content:center; border-radius:12px; font-family:Orbitron; font-size:1.5rem;">${app.name.charAt(0)}</div>`;
            }
            card.appendChild(iconBox);
            card.innerHTML += `<div style="font-family:Orbitron; font-size:0.8rem;">${app.name}</div>`;
            card.onclick = (e) => { e.stopPropagation(); thock.currentTime = 0; thock.play().catch(()=>{}); showDetails(app); };
            grid.appendChild(card);
        });
    }

    function showDetails(app) {
        document.getElementById('details').classList.add('visible');
        const container = document.getElementById('det-icon-container');
        if(app.img && app.img !== "") {
            container.innerHTML = `<img src="${app.img}" style="max-width:140px; border-radius:20px; border:2px solid var(--neon);">`;
        } else {
            container.innerHTML = `<div style="width:120px; height:120px; border:3px solid var(--neon); color:var(--neon); border-radius:20px; display:flex; align-items:center; justify-content:center; font-family:Orbitron; font-size:4rem;">${app.name.charAt(0)}</div>`;
        }
        document.getElementById('det-title').innerText = app.name;
        document.getElementById('det-desc').innerText = app.desc;
        document.getElementById('det-link').href = app.url;
        document.getElementById('det-tags').innerText = app.tags.filter(t => !t.toLowerCase().includes("java") && !t.toLowerCase().includes("bedrock")).map(t => t.startsWith("#") ? t : "#" + t).join(" ");
    }

    function closeDetails() { document.getElementById('details').classList.remove('visible'); }

    function switchTab(cat, el) {
        thock.currentTime = 0; thock.play().catch(()=>{});
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const header = document.getElementById('main-header');
        if(cat === 'home') header.innerText = "NEBULA OS";
        else if(cat === 'acc') header.innerText = "ACCOUNT GEN";
        else header.innerText = cat.toUpperCase() + " EDITION";
        renderApps(cat);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula OS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #bc13fe;
  --purple-glow: rgba(188,19,254,0.15);
  --purple-border: rgba(188,19,254,0.22);
  --purple-dim: rgba(188,19,254,0.08);
  --bg: #06060a;
  --bg2: #0c0c12;
  --surface: rgba(255,255,255,0.035);
  --surface2: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: rgba(255,255,255,0.9);
  --text2: rgba(255,255,255,0.55);
  --text3: rgba(255,255,255,0.3);
  --sidebar-w: 80px;
  --topbar-h: 58px;
  --radius: 16px;
  --ease: cubic-bezier(0.4,0,0.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

/* Scrollbar global */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(188,19,254,.25);border-radius:2px;}

#bgCanvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* ── Shell ── */
.shell{position:relative;z-index:10;display:flex;width:100vw;height:100vh;}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: rgba(8,8,14,0.95);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 0 20px;
  gap: 6px;
  z-index: 200;
  transition: left .35s var(--ease);
  backdrop-filter: blur(24px);
}

.sidebar-logo {
  font-family: 'Orbitron';
  font-size: .52rem;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--purple);
  opacity: .2;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  margin-bottom: 16px;
  user-select: none;
}

.nav-btn {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: .95rem;
  color: var(--text3);
  transition: color .25s var(--ease), background .25s var(--ease), border-color .25s var(--ease), transform .15s var(--ease);
  flex-shrink: 0;
  position: relative;
  user-select: none;
}
.nav-btn:hover {
  color: var(--text2);
  background: var(--surface);
  border-color: var(--border);
  transform: scale(1.04);
}
.nav-btn.on {
  color: var(--text);
  background: var(--purple-dim);
  border-color: var(--purple-border);
}
.nav-btn.on::after {
  content: '';
  position: absolute;
  left: -1px; top: 20%; bottom: 20%;
  width: 2px;
  background: var(--purple);
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 8px var(--purple);
}
.nav-btn .lbl { font-size: .38rem; letter-spacing: 1.5px; font-family: 'Inter'; font-weight: 500; opacity: .5; text-transform: uppercase; }
.nav-btn img { width: 19px; height: 19px; filter: brightness(0) invert(1); opacity: .4; transition: opacity .25s; }
.nav-btn.on img { opacity: .75; }

/* RGB nav buttons */
.nav-btn.rgb { animation: rgb-idle 8s linear infinite; }
@keyframes rgb-idle {
  0%   { color: rgba(255,90,90,.45);  border-color: rgba(255,90,90,.12); }
  33%  { color: rgba(90,220,120,.45); border-color: rgba(90,220,120,.12); }
  66%  { color: rgba(90,140,255,.45); border-color: rgba(90,140,255,.12); }
  100% { color: rgba(255,90,90,.45);  border-color: rgba(255,90,90,.12); }
}
.nav-btn.rgb.on { animation: rgb-on 8s linear infinite; }
@keyframes rgb-on {
  0%   { color: rgba(255,120,120,.9); background: rgba(255,90,90,.08);  border-color: rgba(255,90,90,.3);  }
  33%  { color: rgba(100,230,140,.9); background: rgba(90,220,120,.08); border-color: rgba(90,220,120,.3); }
  66%  { color: rgba(120,160,255,.9); background: rgba(90,140,255,.08); border-color: rgba(90,140,255,.3); }
  100% { color: rgba(255,120,120,.9); background: rgba(255,90,90,.08);  border-color: rgba(255,90,90,.3);  }
}

/* ── Main ── */
.main { flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }

.topbar {
  height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(6,6,10,0.7);
  backdrop-filter: blur(28px);
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}

.topbar-title {
  font-family: 'Orbitron';
  font-size: clamp(.8rem, 1.8vw, 1.15rem);
  font-weight: 700;
  letter-spacing: 6px;
  color: var(--text);
  opacity: .8;
  transition: opacity .3s;
}

.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px 14px;
  transition: border-color .2s, background .2s;
}
.search:focus-within { border-color: var(--purple-border); background: var(--surface2); }
.search input { background:none; border:none; outline:none; color:var(--text); font-family:'Inter'; font-size:.85rem; width:160px; }
.search input::placeholder { color:var(--text3); }
.search-ic { color: var(--text3); font-size:.85rem; }

/* ── Content ── */
.content-wrap { display:flex; flex:1; min-height:0; }
.page { display:none; flex:1; flex-direction:column; min-width:0; overflow:hidden; }
.page.on { display:flex; }

/* ── App Grid ── */
.grid-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
  gap: 12px;
  align-content: start;
  scroll-behavior: smooth;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 12px 14px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  position: relative;
  transition:
    border-color .3s var(--ease),
    background .3s var(--ease),
    transform .25s var(--ease),
    box-shadow .3s var(--ease);
  text-align: center;
}
.card:hover {
  border-color: var(--purple-border);
  background: var(--surface2);
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 0 1px var(--purple-border);
}
.card:active { transform: translateY(-1px); }

.vtag {
  position: absolute; top: 8px; left: 10px;
  font-size: .46rem; font-family: 'Orbitron';
  color: var(--text3); letter-spacing: 1px;
}

.icon-box {
  width: 54px; height: 54px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.icon-box img {
  width: 100%; height: 100%;
  object-fit: contain; border-radius: 10px;
  position: absolute; inset: 0;
  display: none;
  transition: opacity .3s;
}
.icon-box img.ok { display:block; }

.icon-letter {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron'; font-size: 1.35rem; font-weight: 900;
  border: 1px solid rgba(188,19,254,.18);
  border-radius: 10px;
  color: rgba(188,19,254,.4);
  background: rgba(188,19,254,.04);
  transition: border-color .3s, color .3s;
}
.card:hover .icon-letter {
  border-color: rgba(188,19,254,.35);
  color: rgba(188,19,254,.65);
}

.card-name {
  font-family: 'Orbitron'; font-size: .63rem; font-weight: 700;
  letter-spacing: .5px; line-height: 1.4;
  word-break: break-word;
  color: var(--text2);
  transition: color .25s;
}
.card:hover .card-name { color: var(--text); }

/* ── Details Panel ── */
.det-panel {
  width: 360px; min-width: 260px;
  background: rgba(7,7,12,0.98);
  border-left: 1px solid var(--border);
  display: none;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  backdrop-filter: blur(30px);
}
.det-panel.on { display:flex; animation: panel-in .3s var(--ease); }
@keyframes panel-in {
  from { opacity:0; transform:translateX(20px); }
  to   { opacity:1; transform:translateX(0); }
}

.det-body {
  flex: 1;
  overflow-y: auto;
  padding: 48px 24px 16px;
  display: flex; flex-direction: column; align-items: center;
  gap: 14px;
  scroll-behavior: smooth;
}

.det-close {
  position: absolute; top: 14px; right: 16px;
  font-size: .9rem; color: var(--text3);
  cursor: pointer; background: none; border: none;
  transition: color .2s, transform .2s;
  z-index: 10; line-height: 1;
}
.det-close:hover { color: var(--text); transform: rotate(90deg); }

.det-icon-wrap {
  width: 90px; height: 90px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.det-icon-wrap img {
  width: 100%; height: 100%;
  object-fit: contain; border-radius: 20px;
  border: 1px solid var(--border2);
  position: absolute; inset: 0; display: none;
  transition: opacity .3s;
}
.det-icon-wrap img.ok { display:block; }
.det-icon-wrap .icon-letter { font-size: 2.5rem; border-radius: 20px; width:100%; height:100%; }

.det-name {
  font-family: 'Orbitron'; font-size: .95rem; font-weight: 700;
  text-align: center; letter-spacing: 2px; color: var(--text);
}
.det-desc {
  color: var(--text2); font-size: .88rem;
  line-height: 1.75; text-align: center;
}
.det-desc a { color: rgba(188,19,254,.7); text-decoration: underline; text-underline-offset: 3px; }
.det-desc a:hover { color: var(--text); }

.det-tags { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.det-tag {
  font-family: 'Orbitron'; font-size: .5rem; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--purple-border);
  color: rgba(188,19,254,.6);
  background: var(--purple-dim);
  letter-spacing: .5px;
}

.det-foot {
  padding: 14px 24px 22px;
  border-top: 1px solid var(--border);
  background: rgba(7,7,12,0.98);
  flex-shrink: 0;
}

.dl-btn {
  display: block; width: 100%; padding: 14px;
  background: var(--purple-dim);
  border: 1px solid var(--purple-border);
  border-radius: 12px;
  color: var(--text); font-family: 'Orbitron'; font-weight: 700;
  font-size: .78rem; letter-spacing: 2px;
  text-align: center; text-decoration: none;
  transition: background .25s, border-color .25s, box-shadow .25s, transform .15s;
}
.dl-btn:hover {
  background: rgba(188,19,254,.18);
  border-color: rgba(188,19,254,.45);
  box-shadow: 0 0 20px rgba(188,19,254,.15);
  transform: translateY(-1px);
}
.dl-btn:active { transform: translateY(0); }

/* ── Home Page ── */
#page-home { overflow-y: auto; scroll-behavior: smooth; }

.home-hero {
  width: 100%;
  padding: 60px 48px 52px;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.home-hero::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(188,19,254,.06) 0%, transparent 70%);
  pointer-events: none;
}
.home-hero-eyebrow {
  font-family: 'Orbitron'; font-size: .58rem; font-weight: 700;
  letter-spacing: 5px; color: rgba(188,19,254,.5);
  text-transform: uppercase; margin-bottom: 14px;
  opacity: 0; transform: translateY(12px);
  transition: opacity .6s var(--ease), transform .6s var(--ease);
}
.home-hero-title {
  font-family: 'Orbitron';
  font-size: clamp(1.6rem, 3.5vw, 2.8rem);
  font-weight: 900; letter-spacing: 2px;
  color: var(--text); line-height: 1.15;
  margin-bottom: 20px;
  opacity: 0; transform: translateY(16px);
  transition: opacity .65s .08s var(--ease), transform .65s .08s var(--ease);
}
.home-hero-body {
  font-size: 1rem; line-height: 1.85;
  color: var(--text2); max-width: 640px;
  white-space: pre-wrap;
  opacity: 0; transform: translateY(16px);
  transition: opacity .65s .16s var(--ease), transform .65s .16s var(--ease);
}
.home-hero-body a { color: rgba(188,19,254,.7); text-decoration: underline; text-underline-offset: 3px; }
.home-hero-body a:hover { color: var(--text); }

/* Revealed state */
.reveal .home-hero-eyebrow,
.reveal .home-hero-title,
.reveal .home-hero-body { opacity:1; transform:translateY(0); }

/* ── FAQ Section ── */
.faq-section {
  width: 100%;
  padding: 52px 48px;
  border-bottom: 1px solid var(--border);
}
.section-eyebrow {
  font-family: 'Orbitron'; font-size: .58rem; font-weight: 700;
  letter-spacing: 5px; color: rgba(188,19,254,.5);
  text-transform: uppercase; margin-bottom: 12px;
}
.section-title {
  font-family: 'Orbitron';
  font-size: clamp(1.1rem, 2.5vw, 1.8rem);
  font-weight: 900; letter-spacing: 2px;
  color: var(--text); margin-bottom: 32px;
}
.faq-items { display:flex; flex-direction:column; gap:0; max-width: 680px; }

.faq-row {
  padding: 22px 0;
  border-bottom: 1px solid var(--border);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .5s var(--ease), transform .5s var(--ease);
  cursor: pointer;
}
.faq-row:last-child { border-bottom: none; }
.faq-row.vis { opacity:1; transform:translateY(0); }

.faq-q {
  font-family: 'Inter'; font-size: .92rem; font-weight: 600;
  color: var(--text); letter-spacing: .3px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.faq-q::after {
  content: '+';
  font-size: 1.1rem; color: rgba(188,19,254,.5);
  transition: transform .3s var(--ease), color .3s;
  flex-shrink: 0;
}
.faq-row.open .faq-q::after { transform: rotate(45deg); color: var(--purple); }

.faq-a {
  font-size: .9rem; line-height: 1.75;
  color: var(--text2);
  max-height: 0; overflow: hidden;
  transition: max-height .4s var(--ease), padding .3s var(--ease), opacity .3s;
  opacity: 0;
  white-space: pre-wrap;
}
.faq-row.open .faq-a { max-height: 400px; padding-top: 12px; opacity: 1; }
.faq-a a { color: rgba(188,19,254,.7); text-decoration: underline; text-underline-offset: 3px; }
.faq-a a:hover { color: var(--text); }

/* Apps section heading */
.apps-section-head {
  padding: 24px 48px 8px;
  font-family: 'Orbitron'; font-size: .58rem; font-weight: 700;
  letter-spacing: 5px; color: var(--text3);
  text-transform: uppercase;
  opacity: 0;
  transition: opacity .5s .1s var(--ease);
}
.apps-section-head.vis { opacity: 1; }

/* Home grid (no scroll, just flows) */
.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
  gap: 12px;
  padding: 12px 20px 32px;
}

/* ── Empty state ── */
.empty {
  display: none; flex:1; flex-direction:column;
  align-items:center; justify-content:center; gap:12px;
  color: var(--text3); font-family:'Orbitron';
  font-size:.65rem; letter-spacing:3px;
}
.empty.on { display:flex; }
.empty-icon { font-size:2rem; opacity:.15; }

/* ── Account page ── */
.acc-page {
  flex:1; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
  color: var(--text3); font-family:'Orbitron';
  letter-spacing:4px; font-size:.7rem;
}

/* ── Settings ── */
.settings-scroll { flex:1; overflow-y:auto; padding:20px; }
.s-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:12px; }
.s-card h3 { font-family:'Orbitron'; font-size:.6rem; letter-spacing:3px; color:rgba(188,19,254,.45); margin-bottom:16px; text-transform:uppercase; }
.bg-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.bg-opt { border:1px solid var(--border); border-radius:10px; padding:12px 8px; cursor:pointer; text-align:center; background:transparent; transition:border-color .2s, background .2s; }
.bg-opt:hover { border-color:var(--border2); background:var(--surface2); }
.bg-opt.on { border-color:var(--purple-border); background:var(--purple-dim); }
.bg-prev { height:36px; border-radius:6px; margin-bottom:8px; }
.bp1 { background:radial-gradient(ellipse at center, rgba(188,19,254,.12) 0%, transparent 70%); }
.bp2 { background:radial-gradient(ellipse at center, rgba(188,19,254,.3) 0%, transparent 70%); }
.bp3 { background:radial-gradient(ellipse at bottom, rgba(0,80,200,.25) 0%, transparent 70%); }
.bp4 { background:var(--bg); }
.bg-name { font-family:'Orbitron'; font-size:.5rem; letter-spacing:1px; color:var(--text3); }
.s-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
.s-row:last-child { border-bottom:none; }
.s-row label { font-size:.85rem; color:var(--text2); }
.s-row span { font-family:'Orbitron'; font-size:.58rem; color:rgba(188,19,254,.5); letter-spacing:1px; }

/* ── Loader ── */
.loader {
  position:fixed; inset:0; z-index:9999;
  background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  transition:opacity .6s var(--ease);
}
.loader.out { opacity:0; pointer-events:none; }
.loader-title {
  font-family:'Orbitron'; font-size:1.6rem; font-weight:900;
  letter-spacing:10px; color:var(--text); opacity:.8;
  animation: loader-pulse 1.5s ease-in-out infinite alternate;
}
@keyframes loader-pulse { from { opacity:.4; } to { opacity:.85; } }
.loader-bar { width:120px; height:1px; background:rgba(255,255,255,.06); overflow:hidden; }
.loader-fill { height:100%; background:rgba(188,19,254,.5); animation:fill 1.2s ease-in-out forwards; }
@keyframes fill { from{width:0} to{width:100%} }
.loader-sub { font-family:'Orbitron'; font-size:.48rem; letter-spacing:4px; color:var(--text3); opacity:.4; }

/* ── Hamburger ── */
.hamburger { display:none; background:none; border:none; color:var(--text3); font-size:1rem; cursor:pointer; padding:8px; transition:color .2s; }
.hamburger:hover { color:var(--text2); }

/* ── Responsive ── */
@media(max-width:768px){
  :root{--sidebar-w:0px;}
  .sidebar{position:fixed;left:-72px;top:0;bottom:0;width:72px;z-index:300;padding-top:66px;}
  .sidebar.open{left:0;}
  .hamburger{display:flex;align-items:center;}
  .grid-wrap{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));padding:14px;gap:9px;}
  .det-panel{position:fixed;inset:0;width:100%;max-width:100%;z-index:250;}
  .search input{width:100px;}
  .sidebar-logo{display:none;}
  .bg-grid{grid-template-columns:1fr 1fr;}
  .home-hero{padding:36px 22px 32px;}
  .faq-section{padding:36px 22px;}
  .apps-section-head{padding:18px 22px 6px;}
  .home-grid{padding:10px 14px 24px;}
}
@media(max-width:480px){
  .search{display:none;}
  .topbar-title{letter-spacing:3px;}
  .home-hero{padding:28px 16px 26px;}
  .faq-section{padding:28px 16px;}
  .bg-grid{grid-template-columns:1fr 1fr;}
  .grid-wrap{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px;padding:10px;}
}
@media(min-width:1400px){
  .grid-wrap{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .home-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .home-hero{padding:72px 64px 60px;}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-title">NEBULA OS</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div class="loader-sub">INITIALIZING...</div>
</div>

<canvas id="bgCanvas"></canvas>

<div class="shell">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">NOS</div>
    <button class="nav-btn on" id="nb-home" onclick="go('home',this)">
      <img src="https://img.icons8.com/material-rounded/48/home.png" alt="">
      <span class="lbl">Home</span>
    </button>
    <button class="nav-btn" id="nb-acc" onclick="go('acc',this)">
      <img src="https://img.icons8.com/material-rounded/48/user.png" alt="">
      <span class="lbl">Acc</span>
    </button>
    <button class="nav-btn rgb" id="nb-java" onclick="go('java',this)">
      J<span class="lbl">Java</span>
    </button>
    <button class="nav-btn rgb" id="nb-bedrock" onclick="go('bedrock',this)">
      B<span class="lbl">Bedrock</span>
    </button>
    <button class="nav-btn" id="nb-settings" onclick="go('settings',this)">
      ⚙<span class="lbl">Settings</span>
    </button>
  </nav>

  <!-- Main -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <button class="hamburger" id="hamburger" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="topbar-title">NEBULA OS</div>
      <div class="search">
        <span class="search-ic">⌕</span>
        <input type="text" id="searchInput" placeholder="Search apps..." oninput="filterApps()">
      </div>
    </div>

    <div class="content-wrap">

      <!-- HOME -->
      <div class="page on" id="page-home">
        <!-- About Us from "Home" JSON app -->
        <div class="home-hero" id="home-hero" style="display:none;">
          <div class="home-hero-eyebrow">About Us</div>
          <div class="home-hero-title" id="hero-title">NEBULA OS</div>
          <div class="home-hero-body" id="hero-body"></div>
        </div>
        <!-- FAQ from "FAQ" JSON app -->
        <div class="faq-section" id="faq-section" style="display:none;">
          <div class="section-eyebrow">FAQ</div>
          <div class="section-title">Frequently Asked Questions</div>
          <div class="faq-items" id="faq-items"></div>
        </div>
        <!-- Apps divider -->
        <div class="apps-section-head" id="apps-head" style="display:none;">All Apps</div>
        <!-- App grid -->
        <div class="home-grid" id="grid-home"></div>
        <div class="empty on" id="empty-home" style="display:none;"><div class="empty-icon">◈</div><div>NO APPS FOUND</div></div>
      </div>

      <!-- ACCOUNT -->
      <div class="page" id="page-acc">
        <div class="acc-page">
          <div style="font-size:2.5rem;opacity:.08;">👤</div>
          <div>ACCOUNT GENERATOR</div>
          <div style="font-size:.58rem;opacity:.35;margin-top:4px;letter-spacing:3px;">COMING SOON</div>
        </div>
      </div>

      <!-- JAVA -->
      <div class="page" id="page-java">
        <div class="grid-wrap" id="grid-java"></div>
        <div class="empty" id="empty-java"><div class="empty-icon">◈</div><div>NO JAVA APPS</div></div>
      </div>

      <!-- BEDROCK -->
      <div class="page" id="page-bedrock">
        <div class="grid-wrap" id="grid-bedrock"></div>
        <div class="empty" id="empty-bedrock"><div class="empty-icon">◈</div><div>NO BEDROCK APPS</div></div>
      </div>

      <!-- SETTINGS -->
      <div class="page" id="page-settings">
        <div class="settings-scroll">
          <div class="s-card">
            <h3>⬡ Background</h3>
            <div class="bg-grid">
              <div class="bg-opt on" id="bg-opt-1" onclick="setBg(1)"><div class="bg-prev bp1"></div><div class="bg-name">MINIMAL</div></div>
              <div class="bg-opt"    id="bg-opt-2" onclick="setBg(2)"><div class="bg-prev bp2"></div><div class="bg-name">NEBULA</div></div>
              <div class="bg-opt"    id="bg-opt-3" onclick="setBg(3)"><div class="bg-prev bp3"></div><div class="bg-name">BLUE RISE</div></div>
              <div class="bg-opt"    id="bg-opt-4" onclick="setBg(4)"><div class="bg-prev bp4"></div><div class="bg-name">OFF</div></div>
            </div>
          </div>
          <div class="s-card">
            <h3>⬡ System Info</h3>
            <div class="s-row"><label>Apps Loaded</label><span id="info-count">0</span></div>
            <div class="s-row"><label>Java Apps</label><span id="info-java">0</span></div>
            <div class="s-row"><label>Bedrock Apps</label><span id="info-bedrock">0</span></div>
            <div class="s-row"><label>Data Source</label><span>GitHub · Live</span></div>
          </div>
        </div>
      </div>

      <!-- DETAILS -->
      <div class="det-panel" id="detPanel">
        <button class="det-close" onclick="closeDet()">✕</button>
        <div class="det-body">
          <div class="det-icon-wrap" id="det-icon">
            <div class="icon-letter" id="det-letter">?</div>
            <img id="det-img" src="" alt="">
          </div>
          <div class="det-name" id="det-name"></div>
          <p class="det-desc" id="det-desc"></p>
          <div class="det-tags" id="det-tags"></div>
        </div>
        <div class="det-foot">
          <a class="dl-btn" id="det-link" href="#" target="_blank" rel="noopener">⬇ DOWNLOAD</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
'use strict';

// ── State ──
let apps=[], activeBg=1, searchQ='';

// ── Canvas ──
const cv=document.getElementById('bgCanvas');
const cx=cv.getContext('2d');
let W,H,raf;
let mx=-999,my=-999;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
resize();
addEventListener('resize',resize);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:true});

// BG1 — minimal dots
const D1=[];class MDot{constructor(){this.r2();}r2(){this.x=Math.random()*W;this.y=Math.random()<.5?-2:H+2;this.vx=(Math.random()-.5)*.16;this.vy=(Math.random()-.5)*.16;this.r=Math.random()*.8+.25;this.a=Math.random()*.09+.02;}ri(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.16;this.vy=(Math.random()-.5)*.16;this.r=Math.random()*.8+.25;this.a=Math.random()*.09+.02;}upd(){this.x+=this.vx;this.y+=this.vy;if(this.x<-8||this.x>W+8||this.y<-8||this.y>H+8)this.r2();}}
for(let i=0;i<55;i++){const d=new MDot();d.ri();D1.push(d);}
function bg1(){cx.clearRect(0,0,W,H);for(const d of D1){d.upd();cx.beginPath();cx.arc(d.x,d.y,d.r,0,Math.PI*2);cx.fillStyle=`rgba(188,19,254,${d.a})`;cx.fill();}raf=requestAnimationFrame(bg1);}

// BG2 — nebula
const D2=[];class NPt{constructor(){this.rs(true);}rs(i){this.x=Math.random()*W;this.y=i?Math.random()*H:Math.random()*H;this.vx=(Math.random()-.5)*.5;this.vy=(Math.random()-.5)*.5;this.r=Math.random()*2.5+1;this.h=Math.random()*60-30;}upd(){const dx=mx-this.x,dy=my-this.y,d=Math.hypot(dx,dy);if(d<200){const f=(200-d)/200;this.x-=dx/d*f*3.5;this.y-=dy/d*f*3.5;}this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1;}}
for(let i=0;i<110;i++)D2.push(new NPt());
let nt=0;
function bg2(){nt+=.005;cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(0,0,W,H);const gx=W/2+Math.sin(nt*.7)*W*.15,gy=H/2+Math.cos(nt*.5)*H*.1,g=cx.createRadialGradient(gx,gy,0,gx,gy,W*.45);g.addColorStop(0,'rgba(188,19,254,.07)');g.addColorStop(.5,'rgba(100,0,200,.03)');g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(0,0,W,H);if(mx>0){const mg=cx.createRadialGradient(mx,my,0,mx,my,130);mg.addColorStop(0,'rgba(188,19,254,.09)');mg.addColorStop(1,'transparent');cx.fillStyle=mg;cx.fillRect(0,0,W,H);}for(let i=0;i<D2.length;i++){D2[i].upd();const p=D2[i];cx.fillStyle=`hsla(${280+p.h},100%,85%,.9)`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();for(let j=i+1;j<D2.length;j++){const q=D2[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<155){cx.strokeStyle=`rgba(188,19,254,${.42*(1-d/155)})`;cx.lineWidth=.7;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke();}}}raf=requestAnimationFrame(bg2);}

// BG3 — bubbles
const D3=[];class Bbl{constructor(){this.in();}in(){this.x=Math.random()*W;this.y=H+Math.random()*80;this.r=Math.random()*6+2;this.vy=-(Math.random()*.8+.35);this.vx=(Math.random()-.5)*.25;this.a=Math.random()*.6+.2;this.w=Math.random()*Math.PI*2;this.ws=Math.random()*.035+.01;this.ho=Math.random()*50-25;}upd(){this.w+=this.ws;this.x+=this.vx+Math.sin(this.w)*.4;this.y+=this.vy;const dx=mx-this.x,dy=my-this.y,d=Math.hypot(dx,dy);if(d<140){const f=(140-d)/140;this.x-=dx/d*f*2.5;this.y-=dy/d*f*2.5;}if(this.y<-30)this.in();}}
for(let i=0;i<72;i++){const b=new Bbl();b.y=Math.random()*H;D3.push(b);}
let bh=200;
function bg3(){cx.fillStyle='rgba(0,0,0,.15)';cx.fillRect(0,0,W,H);const g=cx.createRadialGradient(W/2,H,0,W/2,H*.8,H);g.addColorStop(0,'rgba(0,60,255,.2)');g.addColorStop(.5,'rgba(0,20,120,.07)');g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(0,0,W,H);if(mx>0){const mg=cx.createRadialGradient(mx,my,0,mx,my,160);mg.addColorStop(0,`hsla(${bh},100%,65%,.12)`);mg.addColorStop(1,'transparent');cx.fillStyle=mg;cx.fillRect(0,0,W,H);}bh=(bh+.13)%360;for(const b of D3){b.upd();const h=bh+b.ho;cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.strokeStyle=`hsla(${h},100%,78%,${b.a})`;cx.lineWidth=1;cx.stroke();cx.fillStyle=`hsla(${h},100%,88%,${b.a*.16})`;cx.fill();}raf=requestAnimationFrame(bg3);}

function startBg(n){
  cancelAnimationFrame(raf);activeBg=n;cx.clearRect(0,0,W,H);
  if(n===1)bg1();else if(n===2)bg2();else if(n===3)bg3();
  for(let i=1;i<=4;i++){const e=document.getElementById('bg-opt-'+i);if(e)e.classList.toggle('on',i===n);}
  try{localStorage.setItem('nob',n);}catch(e){}
}
function setBg(n){thock();startBg(n);}

// ── Sound ──
let AC=null;
function thock(){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    const o=AC.createOscillator(),og=AC.createGain();
    o.type='sine';o.frequency.setValueAtTime(175,t);o.frequency.exponentialRampToValueAtTime(58,t+.06);
    og.gain.setValueAtTime(.48,t);og.gain.exponentialRampToValueAtTime(.001,t+.1);
    o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+.12);
    const n=AC.createOscillator(),ng=AC.createGain();
    n.type='triangle';n.frequency.setValueAtTime(85,t);n.frequency.exponentialRampToValueAtTime(28,t+.05);
    ng.gain.setValueAtTime(.26,t);ng.gain.exponentialRampToValueAtTime(.001,t+.07);
    n.connect(ng);ng.connect(AC.destination);n.start(t);n.stop(t+.08);
  }catch(e){}
}

// ── Data ──
const SRC='https://raw.githubusercontent.com/FNAF232619/Nebula-OS/main/data.json';
async function loadData(){
  try{
    const r=await fetch(SRC);
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    const raw=Array.isArray(d.apps)?d.apps:[];
    const sp=['home','faq'];
    window._home=raw.find(a=>a.name&&a.name.trim().toLowerCase()==='home')||null;
    window._faq =raw.find(a=>a.name&&a.name.trim().toLowerCase()==='faq') ||null;
    apps=raw.filter(a=>!a.name||!sp.includes(a.name.trim().toLowerCase()));
    buildGrids();renderHome();updateInfo();
  }catch(e){console.warn('Load failed:',e);buildGrids();}
}

function lfy(t){
  return(t||'')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(?<!\]\()(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// ── Render home blocks ──
function renderHome(){
  const H=window._home, F=window._faq;
  const hero=document.getElementById('home-hero');
  const faqSec=document.getElementById('faq-section');
  const appsHead=document.getElementById('apps-head');

  // About Us
  if(H&&H.desc){
    document.getElementById('hero-body').innerHTML=lfy(H.desc);
    hero.style.display='';
    setTimeout(()=>hero.classList.add('reveal'),80);
  }else{hero.style.display='none';}

  // FAQ
  if(F){
    const list=document.getElementById('faq-items');
    list.innerHTML='';
    const items=Array.isArray(F.faq)&&F.faq.length>0
      ? F.faq
      : F.desc ? [{q:null,a:F.desc}] : [];
    items.forEach((item,i)=>{
      const row=document.createElement('div');
      row.className='faq-row';
      row.style.transitionDelay=(i*.06)+'s';
      if(item.q){
        row.innerHTML=`<div class="faq-q">${item.q}</div><div class="faq-a">${lfy(item.a||'')}</div>`;
        row.onclick=()=>{row.classList.toggle('open');};
      }else{
        row.innerHTML=`<div class="faq-a" style="padding-top:0;max-height:none;opacity:1;">${lfy(item.a||'')}</div>`;
        row.style.cursor='default';
      }
      list.appendChild(row);
    });
    faqSec.style.display='';
  }else{faqSec.style.display='none';}

  // Apps divider
  if(apps.length>0&&(H||F)){appsHead.style.display='';}
  else{appsHead.style.display='none';}

  // Scroll observer
  setupReveal();
}

function setupReveal(){
  const pg=document.getElementById('page-home');
  const targets=[
    ...document.querySelectorAll('.faq-row'),
    ...document.querySelectorAll('.apps-section-head')
  ];
  if(!targets.length)return;
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('vis');});
  },{root:pg,threshold:.1});
  targets.forEach(t=>obs.observe(t));
}

// ── Tags ──
function ntag(t){return(t||'').replace(/^#+/,'').trim().toLowerCase();}
function hasTag(a,k){return Array.isArray(a.tags)&&a.tags.some(t=>ntag(t).includes(k.toLowerCase()));}
function cats(a){const c=[];if(hasTag(a,'java'))c.push('java');if(hasTag(a,'bedrock'))c.push('bedrock');if(!c.length)c.push('home');return c;}

// ── Grids ──
function buildGrids(){
  const q=searchQ.trim().toLowerCase();
  const jv=[],bd=[];
  for(const a of apps){
    if(q&&!a.name.toLowerCase().includes(q)&&!(a.desc||'').toLowerCase().includes(q))continue;
    const c=cats(a);
    if(c.includes('java'))jv.push(a);
    if(c.includes('bedrock'))bd.push(a);
  }
  const hm=q?apps.filter(a=>a.name.toLowerCase().includes(q)||(a.desc||'').toLowerCase().includes(q)):apps;
  rGrid('home',hm);rGrid('java',jv);rGrid('bedrock',bd);

  // Show/hide apps head
  const head=document.getElementById('apps-head');
  if(head)head.classList.toggle('vis',hm.length>0&&(window._home||window._faq));
}

function rGrid(tab,list){
  const g=document.getElementById('grid-'+tab);
  const e=document.getElementById('empty-'+tab);
  g.innerHTML='';
  if(!list.length){
    e.style.display='flex';e.classList.add('on');
    // hide the grid container flex
    g.style.display='none';
    return;
  }
  e.style.display='none';e.classList.remove('on');
  g.style.display='';
  list.forEach((a,i)=>{
    const c=mkCard(a);
    c.style.opacity='0';
    c.style.transform='translateY(14px)';
    c.style.transition=`opacity .35s ${i*.03}s, transform .35s ${i*.03}s, border-color .3s, background .3s, box-shadow .3s, transform .25s`;
    g.appendChild(c);
    // staggered appear
    requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.opacity='1';c.style.transform='translateY(0)';}));
  });
}

function mkCard(a){
  const c=document.createElement('div');c.className='card';
  if(a.version){const v=document.createElement('div');v.className='vtag';v.textContent=a.version;c.appendChild(v);}
  const ib=document.createElement('div');ib.className='icon-box';
  const lt=document.createElement('div');lt.className='icon-letter';lt.textContent=(a.name||'?')[0].toUpperCase();ib.appendChild(lt);
  if(a.img&&a.img.trim()&&a.img!=='none'){
    const img=document.createElement('img');img.alt=a.name;
    img.onload=()=>{img.classList.add('ok');lt.style.display='none';};
    img.onerror=()=>{img.remove();lt.style.display='';};
    img.src=a.img;ib.appendChild(img);
  }
  c.appendChild(ib);
  const nm=document.createElement('div');nm.className='card-name';nm.textContent=a.name||'';c.appendChild(nm);
  c.onclick=()=>openDet(a);
  return c;
}

// ── Details ──
function openDet(a){
  const p=document.getElementById('detPanel');
  const lt=document.getElementById('det-letter');
  const img=document.getElementById('det-img');
  lt.textContent=(a.name||'?')[0].toUpperCase();
  lt.style.display='';img.classList.remove('ok');img.src='';
  if(a.img&&a.img.trim()&&a.img!=='none'){
    img.src=a.img;img.alt=a.name;
    img.onload=()=>{img.classList.add('ok');lt.style.display='none';};
    img.onerror=()=>{lt.style.display='';};
  }
  document.getElementById('det-name').textContent=a.name||'';
  document.getElementById('det-desc').innerHTML=lfy(a.desc||'');
  document.getElementById('det-link').href=a.url||'#';
  const tg=document.getElementById('det-tags');tg.innerHTML='';
  (a.tags||[]).forEach(t=>{const s=document.createElement('span');s.className='det-tag';s.textContent=t.startsWith('#')?t:'#'+t;tg.appendChild(s);});
  p.classList.add('on');
}
function closeDet(){document.getElementById('detPanel').classList.remove('on');}

// ── Tabs ──
const TITLES={home:'NEBULA OS',acc:'ACCOUNT GEN',java:'JAVA EDITION',bedrock:'BEDROCK EDITION',settings:'SETTINGS'};
function go(tab,el){
  thock();
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  const pg=document.getElementById('page-'+tab);
  if(pg)pg.classList.add('on');
  document.getElementById('topbar-title').textContent=TITLES[tab]||tab.toUpperCase();
  closeDet();
  if(innerWidth<=768)document.getElementById('sidebar').classList.remove('open');
  if(tab==='home')setTimeout(setupReveal,60);
}

function filterApps(){searchQ=document.getElementById('searchInput').value;buildGrids();}

function updateInfo(){
  document.getElementById('info-count').textContent=apps.length;
  document.getElementById('info-java').textContent=apps.filter(a=>hasTag(a,'java')).length;
  document.getElementById('info-bedrock').textContent=apps.filter(a=>hasTag(a,'bedrock')).length;
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
document.addEventListener('click',e=>{
  const sb=document.getElementById('sidebar'),hb=document.getElementById('hamburger');
  if(innerWidth<=768&&sb.classList.contains('open')&&!sb.contains(e.target)&&e.target!==hb)sb.classList.remove('open');
});

// ── Init ──
(async()=>{
  try{const s=parseInt(localStorage.getItem('nob'));if(s>=1&&s<=4)activeBg=s;}catch(e){}
  startBg(activeBg);
  await loadData();
  setTimeout(()=>{
    document.getElementById('loader').classList.add('out');
    setTimeout(()=>document.getElementById('loader').remove(),650);
  },950);
})();
</script>
